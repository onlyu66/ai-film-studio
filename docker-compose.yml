services:
  studio:
    build: .
    volumes:
      - .:/app
    environment:
      - GEMINI_API_KEY
      - GEMINI_MODEL
      - GROQ_API_KEY
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - REPLICATE_API_TOKEN
      - POLLINATIONS_API_KEY
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
    depends_on:
      - ollama
    entrypoint: ["python"]

  ui:
    build: .
    volumes:
      - .:/app
    ports:
      - "${UI_PORT:-8080}:8000"
    environment:
      - GEMINI_API_KEY
      - GEMINI_MODEL
      - GROQ_API_KEY
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - REPLICATE_API_TOKEN
      - POLLINATIONS_API_KEY
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
    depends_on:
      - ollama
    entrypoint: ["python", "-m", "uvicorn", "studio.server:app", "--host", "0.0.0.0", "--port", "8000"]

  ollama:
    image: ollama/ollama:latest
    container_name: studio_ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  ollama_models:
